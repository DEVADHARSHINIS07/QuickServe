server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL JDBC Datasource Settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_canteen?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:student}
